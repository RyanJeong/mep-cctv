# SonarQube project configuration for mep-cctv.
# C++14 project: suppress rules that require C++17 syntax, anonymous
# namespace rules, and test-specific patterns.

sonar.projectKey=mep-cctv
sonar.projectName=mep-cctv
sonar.sources=include,src
sonar.tests=tests
sonar.language=c++
sonar.cfamily.compile-commands=build/compile_commands.json

# ---------------------------------------------------------------------------
# File-level suppressions (C++14 incompatible or idiomatic C++ patterns)
# ---------------------------------------------------------------------------

sonar.issue.ignore.multicriteria=\
  s5812cc,s5812hpp,\
  s6004cc,s6004hpp,\
  s6005cc,s6005hpp,\
  s1000cc,s1000hpp,\
  s1313test,\
  s3656test,\
  s5443test

# cpp:S5812 -- nested namespace syntax is C++17; C++14 needs separate openings
sonar.issue.ignore.multicriteria.s5812cc.ruleKey=cpp:S5812
sonar.issue.ignore.multicriteria.s5812cc.resourceKey=**/*.cc
sonar.issue.ignore.multicriteria.s5812hpp.ruleKey=cpp:S5812
sonar.issue.ignore.multicriteria.s5812hpp.resourceKey=**/*.hpp

# cpp:S6004 -- if-init-statement is C++17
sonar.issue.ignore.multicriteria.s6004cc.ruleKey=cpp:S6004
sonar.issue.ignore.multicriteria.s6004cc.resourceKey=**/*.cc
sonar.issue.ignore.multicriteria.s6004hpp.ruleKey=cpp:S6004
sonar.issue.ignore.multicriteria.s6004hpp.resourceKey=**/*.hpp

# cpp:S6005 -- structured bindings are C++17
sonar.issue.ignore.multicriteria.s6005cc.ruleKey=cpp:S6005
sonar.issue.ignore.multicriteria.s6005cc.resourceKey=**/*.cc
sonar.issue.ignore.multicriteria.s6005hpp.ruleKey=cpp:S6005
sonar.issue.ignore.multicriteria.s6005hpp.resourceKey=**/*.hpp

# cpp:S1000 -- anonymous namespace is the C++ idiom for file-local linkage
sonar.issue.ignore.multicriteria.s1000cc.ruleKey=cpp:S1000
sonar.issue.ignore.multicriteria.s1000cc.resourceKey=**/*.cc
sonar.issue.ignore.multicriteria.s1000hpp.ruleKey=cpp:S1000
sonar.issue.ignore.multicriteria.s1000hpp.resourceKey=**/*.hpp

# cpp:S1313 -- hardcoded IPs are RFC 1918 test fixture addresses
sonar.issue.ignore.multicriteria.s1313test.ruleKey=cpp:S1313
sonar.issue.ignore.multicriteria.s1313test.resourceKey=tests/**/*.cc

# cpp:S3656 -- GoogleTest fixtures use protected: members by convention
sonar.issue.ignore.multicriteria.s3656test.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.s3656test.resourceKey=tests/**/*.cc

# cpp:S5443 -- /tmp paths in tests are intentional error-path fixtures
sonar.issue.ignore.multicriteria.s5443test.ruleKey=cpp:S5443
sonar.issue.ignore.multicriteria.s5443test.resourceKey=tests/**/*.cc
