name: Learn CI

# Manual teaching example; ci.yml is the repository gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [onnx, native]
    name: "mode ${{ matrix.mode }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CMake
        run: python -m pip install "cmake>=4.0,<5.0"

      # CMake fetches the checksum-pinned runtime for ONNX mode.
      - name: Configure
        run: |
          args=(-DCCTV_MODE=${{ matrix.mode }})
          if [ "${{ matrix.mode }}" = native ]; then
            args+=(-DCCTV_MODEL=placeholder)
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON "${args[@]}"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
