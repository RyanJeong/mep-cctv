coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
        if_not_found: success
    patch:
      default:
        target: 90%
        threshold: 1%
        if_not_found: success

# Must stay in step with the lcov --remove list in .github/workflows/ci.yml,
# or Codecov and the CI gate report different numbers for the same commit.
# Device I/O is excluded because the runner has no camera and no sound card:
# those files can only ever measure near-zero here, and they are exercised on
# the Pi instead.
ignore:
  - "_deps/**"
  - "tests/**"
  - "app/video_capture_v4l2.cc"
  - "app/audio_capture_alsa.cc"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
